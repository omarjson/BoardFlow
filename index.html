<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#007aff" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#1c1c1e" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="BoardFlow">
  <meta name="description" content="BoardFlow — Personal board and whiteboard app">
  <title>BoardFlow</title>

  <!-- PWA -->
  <link rel="manifest" href="/manifest.json">
  <link rel="icon" href="/assets/icons/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/assets/icons/apple-touch-icon.png">
  <link rel="apple-touch-icon" sizes="192x192" href="/assets/icons/icon-192.png">
  <link rel="apple-touch-icon" sizes="512x512" href="/assets/icons/icon-512.png">

  <!-- Open Graph -->
  <meta property="og:type" content="website">
  <meta property="og:title" content="BoardFlow">
  <meta property="og:description" content="Your personal board and whiteboard — infinite canvas, AI, and real-time collaboration.">
  <meta property="og:image" content="/assets/icons/icon-512.png">
  <meta property="og:url" content="/">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="BoardFlow">
  <meta name="twitter:description" content="Your personal board and whiteboard — infinite canvas, AI, and real-time collaboration.">
  <meta name="twitter:image" content="/assets/icons/icon-512.png">

  <!-- CSS -->
  <link rel="stylesheet" href="/css/variables.css">
  <link rel="stylesheet" href="/css/reset.css">
  <link rel="stylesheet" href="/css/main.css">
  <link rel="stylesheet" href="/css/auth.css">
  <link rel="stylesheet" href="/css/dashboard.css">
  <link rel="stylesheet" href="/css/components/toolbar.css">
  <link rel="stylesheet" href="/css/components/template-gallery.css">
  <link rel="stylesheet" href="/css/board.css">
  <link rel="stylesheet" href="/css/components/minimap.css">
  <link rel="stylesheet" href="/css/components/sticky-note.css">
  <link rel="stylesheet" href="/css/components/rich-note.css">
  <link rel="stylesheet" href="/css/components/sketch.css">
  <link rel="stylesheet" href="/css/components/file-manager.css">
  <link rel="stylesheet" href="/css/components/link-card.css">
  <link rel="stylesheet" href="/css/components/media-player.css">
  <link rel="stylesheet" href="/css/components/roadmap.css">
  <link rel="stylesheet" href="/css/components/ai-assistant.css">
  <link rel="stylesheet" href="/css/components/chat.css">
  <link rel="stylesheet" href="/css/rtl.css">
  <link rel="stylesheet" href="/css/responsive.css">
  <link rel="stylesheet" href="/css/components/search.css">

  <!-- Supabase Client -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" defer></script>

  <!-- Puter.js -->
  <script src="https://js.puter.com/v2/" defer></script>
</head>
<body>

  <div id="app">

    <!-- ========== LOGIN PAGE ========== -->
    <div id="page-login" class="page auth-page active">
      <div class="auth-container">
        <div class="auth-card">
          <div class="auth-logo">
            <h1 data-i18n="app_name">BoardFlow</h1>
            <p data-i18n="app_desc">Your personal board and whiteboard</p>
          </div>

          <div id="login-message" class="auth-message"></div>

          <form id="login-form" class="auth-form">
            <div class="form-group">
              <label for="login-email" data-i18n="email">Email</label>
              <input type="email" id="login-email" placeholder="you@example.com" required autocomplete="email">
            </div>
            <div class="form-group">
              <label for="login-password" data-i18n="password">Password</label>
              <input type="password" id="login-password" placeholder="Your password" required autocomplete="current-password">
            </div>
            <button type="submit" class="btn btn-primary btn-block" data-i18n="sign_in">Sign In</button>
          </form>

          <div class="auth-divider">or</div>

          <button id="login-google" class="btn btn-google btn-block">
            <svg viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92a5.06 5.06 0 0 1-2.2 3.32v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.1z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg>
            <span data-i18n="continue_google">Continue with Google</span>
          </button>

          <div class="auth-footer">
            <span data-i18n="no_account">Don't have an account?</span> <a href="#/signup" data-i18n="sign_up">Sign Up</a>
          </div>
        </div>
      </div>
    </div>

    <!-- ========== SIGNUP PAGE ========== -->
    <div id="page-signup" class="page auth-page">
      <div class="auth-container">
        <div class="auth-card">
          <div class="auth-logo">
            <h1 data-i18n="app_name">BoardFlow</h1>
            <p data-i18n="create_account">Create your account</p>
          </div>

          <div id="signup-message" class="auth-message"></div>

          <form id="signup-form" class="auth-form">
            <div class="form-group">
              <label for="signup-name" data-i18n="display_name">Display Name</label>
              <input type="text" id="signup-name" placeholder="Your name" required autocomplete="name">
            </div>
            <div class="form-group">
              <label for="signup-email" data-i18n="email">Email</label>
              <input type="email" id="signup-email" placeholder="you@example.com" required autocomplete="email">
            </div>
            <div class="form-group">
              <label for="signup-password" data-i18n="password">Password</label>
              <input type="password" id="signup-password" placeholder="Min. 8 characters" required minlength="8" autocomplete="new-password">
            </div>
            <div class="form-group">
              <label for="signup-confirm" data-i18n="confirm_password">Confirm Password</label>
              <input type="password" id="signup-confirm" placeholder="Repeat password" required minlength="8" autocomplete="new-password">
            </div>
            <button type="submit" class="btn btn-primary btn-block" data-i18n="sign_up">Create Account</button>
          </form>

          <div class="auth-footer">
            <span data-i18n="has_account">Already have an account?</span> <a href="#/" data-i18n="sign_in">Sign In</a>
          </div>
        </div>
      </div>
    </div>

    <!-- ========== DASHBOARD PAGE ========== -->
    <div id="page-dashboard" class="page dashboard-page">
      <aside class="sidebar">
        <div class="sidebar-header">
          <h2 style="font-size: var(--text-lg); font-weight: var(--weight-semibold);">BoardFlow</h2>
        </div>
        <div class="sidebar-content" id="sidebar-content"></div>
        <div class="sidebar-footer" id="sidebar-footer"></div>
      </aside>
      <main class="main-content" id="dashboard-main"></main>
    </div>

    <!-- ========== BOARD PAGE ========== -->
    <div id="page-board" class="page board-page">
      <div class="board-toolbar" id="board-toolbar"></div>
      <div class="board-canvas" id="canvas">
        <div class="canvas-container" id="canvas-container"></div>
      </div>
      <div class="minimap" id="minimap"></div>
    </div>

  </div>

  <!-- JS -->
  <script src="/js/config.js?v=8" defer></script>
  <script src="/js/utils/icons.js?v=8" defer></script>
  <script src="/js/i18n/i18n.js?v=8" defer></script>
  <script src="/js/router.js?v=8" defer></script>
  <script src="/js/auth/auth.js?v=8" defer></script>
  <script src="/js/auth/login.js?v=8" defer></script>
  <script src="/js/auth/signup.js?v=8" defer></script>
  <script src="/js/ui/search.js?v=8" defer></script>
  <script src="/js/ui/modal.js?v=8" defer></script>
  <script src="/js/ui/toast.js?v=8" defer></script>
  <script src="/js/board/board-manager.js?v=8" defer></script>
  <script src="/js/ui/sidebar.js?v=8" defer></script>
  <script src="/js/templates/template-engine.js?v=8" defer></script>
  <script src="/js/templates/template-gallery.js?v=8" defer></script>
  <script src="/js/utils/helpers.js?v=8" defer></script>
  <script src="/js/utils/dom.js?v=8" defer></script>
  <script src="/js/ui/context-menu.js?v=8" defer></script>
  <script src="/js/components/sticky-note.js?v=8" defer></script>
  <script src="/js/components/rich-note.js?v=8" defer></script>
  <script src="/js/board/history.js?v=8" defer></script>
  <script src="/js/components/sketch.js?v=8" defer></script>
  <script src="/js/board/export.js?v=8" defer></script>
  <script src="/js/board/canvas.js?v=8" defer></script>
  <script src="/js/board/item-manager.js?v=8" defer></script>
  <script src="/js/board/drag-drop.js?v=8" defer></script>
  <script src="/js/board/selection.js?v=8" defer></script>
  <script src="/js/ui/minimap.js?v=8" defer></script>
  <script src="/js/utils/storage.js?v=8" defer></script>
  <script src="/js/utils/image-utils.js?v=8" defer></script>
  <script src="/js/components/screenshot.js?v=8" defer></script>
  <script src="/js/components/file-manager.js?v=8" defer></script>
  <script src="/js/components/link-card.js?v=8" defer></script>
  <script src="/js/components/audio-record.js?v=8" defer></script>
  <script src="/js/components/video-upload.js?v=8" defer></script>
  <script src="/js/components/media-player.js?v=8" defer></script>
  <script src="/js/components/roadmap.js?v=8" defer></script>
  <script src="/js/board/connections.js?v=8" defer></script>
  <script src="/js/ai/ai-assistant.js?v=8" defer></script>
  <script src="/js/sharing/permissions.js?v=8" defer></script>
  <script src="/js/sharing/share-manager.js?v=8" defer></script>
  <script src="/js/components/chat.js?v=8" defer></script>
  <script src="/js/pwa.js?v=8" defer></script>
  <script src="/js/app.js?v=8" defer></script>
</body>
</html>
